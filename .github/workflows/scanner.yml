name: Scanner Diario ELTOPO

permissions:
  contents: write

concurrency:
  group: eltopo-scanner
  cancel-in-progress: false

on:
  # 6 ejecuciones L-V (horario invierno España)
  schedule:
    - cron: '10 14 * * 1-5'   # 15:10 España
    - cron: '15 15 * * 1-5'   # 16:15 España
    - cron: '50 16 * * 1-5'   # 17:50 España
    - cron: '35 18 * * 1-5'   # 19:35 España
    - cron: '0 20 * * 1-5'    # 21:00 España
    - cron: '15 21 * * 1-5'   # 22:15 España

  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo: full (5158) o top1000'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - top1000

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determinar modo
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            echo "mode=full" >> $GITHUB_OUTPUT
          fi

      - name: Run scanner (full)
        if: steps.config.outputs.mode == 'full'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          echo "Modo FULL: analizando todos los 5158 tickers"
          python -c "from scanner.scanner import escanear; escanear(max_tickers=5158, top_n_long=15, top_n_short=15, save_top_long=1000)"

      - name: Run scanner (top1000)
        if: steps.config.outputs.mode == 'top1000'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          echo "Modo TOP1000: analizando top 1000 del dia"
          python -c "from scanner.scanner import escanear; escanear(max_tickers=1000, top_n_long=15, top_n_short=15, save_top_long=1000)"

      - name: Show result summary
        run: |
          python -c "import json; d=json.load(open('data/scanner_result.json')); print(f'Total: {d[\"total_analizados\"]} tickers en {d[\"tiempo_segundos\"]}s'); print(f'Fecha: {d[\"fecha\"]}')"

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scanner_result.json
          [ -f data/top_1000.json ] && git add data/top_1000.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: scanner $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          for i in 1 2 3; do
            git push && break
            echo "Push falló, reintentando ($i/3)..."
            git pull --rebase origin main
            sleep 5
          done
