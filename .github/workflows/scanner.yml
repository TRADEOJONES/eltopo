name: Scanner Diario ELTOPO

permissions:
  contents: write

on:
  # 12 ejecuciones L-V (horario invierno España)
  schedule:
    - cron: '0 7 * * 1-5'    # 08:00 España = pre-mercado
    - cron: '0 10 * * 1-5'   # 11:00 España = mañana
    - cron: '0 13 * * 1-5'   # 14:00 España = 1.5h pre-USA
    - cron: '0 14 * * 1-5'   # 15:00 España = 30min pre-USA
    - cron: '0 15 * * 1-5'   # 16:00 España = post-apertura
    - cron: '0 16 * * 1-5'   # 17:00 España = 1.5h post
    - cron: '0 17 * * 1-5'   # 18:00 España = mediodía USA
    - cron: '0 18 * * 1-5'   # 19:00 España = tarde
    - cron: '0 19 * * 1-5'   # 20:00 España = tarde
    - cron: '0 20 * * 1-5'   # 21:00 España = última hora
    - cron: '0 21 * * 1-5'   # 22:00 España = cierre USA
    - cron: '0 22 * * 1-5'   # 23:00 España = post-cierre

  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo: full (5158) o top1000'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - top1000

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determinar modo
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            echo "mode=full" >> $GITHUB_OUTPUT
          fi

      - name: Run scanner (full)
        if: steps.config.outputs.mode == 'full'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          echo "Modo FULL: analizando todos los 5158 tickers"
          python -c "from scanner.scanner import escanear; escanear(max_tickers=5158, top_n_long=15, top_n_short=15, save_top_long=1000)"

      - name: Run scanner (top1000)
        if: steps.config.outputs.mode == 'top1000'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          echo "Modo TOP1000: analizando top 1000 del dia"
          python -c "from scanner.scanner import escanear; tickers_file='data/top_1000.json', top_n_long=15, top_n_short=15, save_top_long=0"

      - name: Show result summary
        run: |
          python -c "import json; d=json.load(open('data/scanner_result.json')); print(f'Total: {d[\"total_analizados\"]} tickers en {d[\"tiempo_segundos\"]}s'); print(f'Fecha: {d[\"fecha\"]}')"

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scanner_result.json
          git add data/top_1000.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: scanner $(date +'%Y-%m-%d %H:%M')"
          git push
